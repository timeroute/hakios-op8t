# Device profile: sourced by common/build.sh and common/run.sh. Copy with common/new-device.sh.
# Everything here is plain shell variables; see docs/PORTING.md for where each value comes from.
#
# OnePlus 8T (kebab, KB2000). First pass of the port from the OnePlus 8 Pro (instantnoodlep).
# The SoC is the same SM8250/kona (GIC, PM8150, UFS 1d84000, Adreno 650, QCA6390), but the 8T is
# the *flat 1080 x 2400 120 Hz* phone, not the Pro's curved 1440 x 3168 (run at 1080 x 2376):
# no QHD mode and no Pro telephoto/AK7377 motor. Its live DT does carry Pixelworks Iris properties
# (pxlw,iris-chip-enable, pixelworks,iris), like the Pro's, and a Samsung amb655x command-mode DSC
# panel (ABL: "DisplayDxe: Resolution 1080x2400", panel id 00A50501). The touch IC is the OnePlus 8's
# S6SY761 ("SY771", 0x48, reset/IRQ TLMM 38/39). So the 8T uses the 8's geometry and touch with the
# Pro's kona kernel path, through board=kebab (kebab_board() below).
#
# VERIFIED FROM THE PHONE (2026-11-17, read only): its device tree, /proc and ABL log are in
# ../op8t-data/ (outside the repos), and tools/board-from-dt.py reports the same board_<block>=
# addresses as the kernel's defaults, so BOARD_ARGS stays empty. NOT VERIFIED: a boot, firmware,
# UEFI DXEs, push path, 120 Hz switch and every peripheral after framebuffer/CPU/touch. Hardware
# is added one line at a time after a RAM run shows the value is right. See docs/devices/kebab.md.

NAME="OnePlus 8T (kebab)"
KIND=phone                      # phone | qemu
SOC="Qualcomm Snapdragon 865 (SM8250)"
# ro.product.device on the attached KB2000_21_201110 (HydrogenOS 11) is OnePlus8T; the Mu-Silicium
# board name is kebab. Nothing is flashed on anything else (common/flash scripts check CODENAMES).
CODENAMES="kebab OnePlus8T KB2000"

# --- boot chain (phones) ---------------------------------------------------------------------------
# Mu-Silicium already carries Platforms/OnePlus/kebabPkg upstream, and its Resources/Configs/kebab.toml
# puts the UEFI FD at 0x9FC00000 with size 0x300000 (the same map as the OnePlus 8/8 Pro). The DXE
# binaries come from this phone's own xbl (uefi/files/Binaries/kebab/, never committed); as a first
# approximation uefi/apply.sh copies the OnePlus 8's set, which itself came mostly from kebab.
UEFI_TARGET=kebab
UEFI_FD=
# The device tree must be the one this phone boots (extract from its boot_a/vendor_boot, not from
# the firmware of another 8T): uefi/files/Resources/DTBs/kebab.dtb. Until then Mu-Silicium's own
# kebab.dtb is used, which is only a starting point for board_<block>= addresses.
# THIS phone's own live FDT, pulled read-only from TWRP on 2026-11-17 (outside the repos, never commit).
# Mu-Silicium's upstream kebab.dtb is only a placeholder; copy this one into its Resources/DTBs/ if
# building without the profile. tools/board-from-dt.py reads the same file for BOARD_ARGS (below).
DTB=/home/quentin/projects/op8t-data/dtb/kebab-live.dtb
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000

# --- kernel and loader -----------------------------------------------------------------------------
# platform_kebab in xnuloader/loader.c. The ABL's continuous splash is at the same address as on the
# other two OnePlus kona phones; 1080 x 2400 makes fb_base/fb_height ambiguous with the OnePlus 8,
# so common/build.sh and xl send an explicit "platform=kebab" payload entry (xnuloader/loader.c).
FB_BASE=0x9C000000
WIFI_ATH11K=0                   # QCA6390 on PCIe, as on the OnePlus 8/8 Pro
BOARD_ARGS=""                   # TODO: fill from tools/board-from-dt.py on this phone's own DTB

# --- what the run needs ----------------------------------------------------------------------------
# First boot: framebuffer, CPUs and the OnePlus 8's touch driver (the 8T's own device tree, read
# 2026-11-17, names the same S6SY761/SY771 at 0x48 with reset/IRQ TLMM 38/39 and 1080x2400).
# That tree is misleading: the controller that answers is a Synaptics S3908 (TouchComm/TCM) at I2C
# 0x4b, driven by bsd/dev/kebab_tcm.c (verified 2026-11-18: identify "s3908-15.0.0...", panel
# 1079 x 2399, and touches reaching SpringBoard). The 8's S6SY761 driver is off unless
# `kebab_touch=1`; `kebab_tcm=0` turns the TCM driver off.
# Never touchscreen=1 (the redwood Goodix driver; on the OnePlus phones GPIO 68 drops the phone into
# CrashDump). The panel is a Samsung amb655x (ABL: "DisplayDxe: Resolution 1080x2400", panel id
# 00A50501); its 120 Hz timing@1 is marked default, so fb_hz=120 only sets iOS's pacing -- no DCS
# write is sent on kebab (the 8's 90 Hz sequence is not the 8T's). fb_push=2 is the Pro's push path
# and is not yet verified here. gpu=1: the kernel's whole bring-up runs on this phone (steps 1-21:
# CX on, zap accepted by TrustZone, GMU started, 3D core writes our memory) and the GPU stays on for
# the system; the ZAP region 0x8c51a000 is the 8's, which is what the non-Pro kona branch uses, and
# the a650 firmware came from this phone's /vendor/firmware into fw-gpu/. The window server still
# draws in software until USERLAND_VARS has GL=1 (Mesa, tools/mk-mesa.sh) in root.apfs. Next, one at
# a time after a RAM run: torch=3 (PM8150L flash LED), haptic=5 (AW8697 at 0x5a), adsp=1 sound=4
# sound_amps=1 (needs fw-audio), wifi=1 (QCA6390, needs fw-wifi), cam=5 (the 8T has no Pro
# telephoto), the X55 modem set. The gauge is bq27541 at 0x55, as on the 8.
BOOTARGS="hk_defaults=0 cpus=8 bootcpu=7 cpufreq=1 fb_hz=120 fb_push=2 fbwidth=1080 fbheight=2400 gpu=1"
DEFAULT_SECS=600
USERLAND_VARS="GL=1"            # Mesa (tools/mk-mesa.sh) so CoreAnimation draws with the GPU gpu=1 keeps on:
                                # lib/libOSMesa.8.dylib + lib/libhakios.gl.dylib in root.apfs (verified
                                # 2026-11-19: EAGLContext 8/8 ours, FD650, 50 frames a second)
# aw8697_haptic_170.bin is in ../op8t-data/backup/vendor-firmware (copy to fw-haptic/ when building).
# GPU/audio/Wi-Fi firmware and the UEFI DXEs are still needed from this phone's vendor/xbl partitions.
FIRMWARE=""

# --- installed mode ----------------------------------------------------------------------------------
# Not attempted. Android is on this phone; a later install would carve a `darwin` partition off the
# end of userdata as on the 8 Pro, with the UEFI in the spare boot slot. Needs the owner's approval
# for every partition write and a verified RAM image first (docs/INSTALL.md).
FLASH_BOOTARGS=""
FLASH_USERLAND_VARS=""
